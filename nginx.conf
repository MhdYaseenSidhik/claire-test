server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip the text assets the SPA and CSVs are made of.
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    # SPA history fallback: client-routed deep links resolve to index.html
    # rather than 404. Real files (JS, CSS, /data/*.csv) are served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The committed dataset the loader fetches at runtime. Served as-is with a
    # correct content type; must return 200 for the dashboard to render data.
    location /data/ {
        types { text/csv csv; }
        default_type text/csv;
        try_files $uri =404;
    }
}
